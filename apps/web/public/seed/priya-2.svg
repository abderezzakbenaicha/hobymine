<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Illustrated demo portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F120C"/><stop offset="1" stop-color="#402418"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0" stop-color="#FFAB66" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#FFAB66" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFAB66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9764C"/><stop offset="1" stop-color="#945A37"/>
    </linearGradient>
    <linearGradient id="clothes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#643521"/><stop offset="1" stop-color="#080A0D"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15100D"/><stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#15100D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7FF3E"/><stop offset="1" stop-color="#FFAB66"/>
    </linearGradient>
    <filter id="blur80"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="grain">
