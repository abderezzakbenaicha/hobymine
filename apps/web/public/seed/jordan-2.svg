<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Illustrated demo portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141018"/><stop offset="1" stop-color="#2C2238"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0" stop-color="#B9A7FF" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#B9A7FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B9A7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C68E68"/><stop offset="1" stop-color="#A06B47"/>
    </linearGradient>
    <linearGradient id="clothes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D3152"/><stop offset="1" stop-color="#080A0D"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1B14"/><stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#2B1B14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7FF3E"/><stop offset="1" stop-color="#B9A7FF"/>
    </linearGradient>
    <filter id="blur80"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
  </defs>

